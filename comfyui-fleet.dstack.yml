type: fleet
name: comfyui

# A fleet is the instance pool the task provisions into. dstack 0.20.x won't
# auto-create one for a task run, hence the "no fleets" error — this fixes that.

# Region-agnostic (no network volume): any RunPod region, cheapest GPU wins.
backends: [runpod]

# On-demand only (no spot reclaim mid-generation).
spot_policy: on-demand

# nodes: 0..1 = provision the instance on demand when a run is submitted, and
# scale back to 0 when idle so you don't pay between generations.
nodes: 0..1
idle_duration: 1h

resources:
  # Superset of both task modes' gpu specs (comfyui.dstack.yml pins RTX5090;
  # comfyui-cheap.dstack.yml floats across the whole Blackwell menu) — the
  # CUDA-13 image wants an R580+ host driver, which on RunPod means a
  # Blackwell host. Keep this list/memory floor in sync with whichever task
  # file has the loosest spec (currently comfyui-cheap.dstack.yml).
  #
  # Both task files set `fleets: [comfyui]`, so they only provision into this
  # fleet (not the looser `ollama` one, which used to hand us an RTXPRO4000).
  # Each task's own name list is the binding filter per run; this fleet spec
  # just has to be able to satisfy either.
  gpu:
    name: [RTXPRO4000, RTXPRO4500, RTX5090, RTXPRO5000]
    memory: 24GB..
  # ~100GB of fp16 models download to ephemeral disk each boot (no volume),
  # plus image + ComfyUI + outputs — must match the tasks' disk requirement.
  disk: 200GB..
