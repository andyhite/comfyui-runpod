type: task
name: comfyui

# Cheap-mode twin of comfyui.dstack.yml: same image/env/ports, but instead of
# pinning to RTX5090 this lets dstack land on whichever Blackwell card is
# cheapest right now. Use this when raw speed doesn't matter (e.g. idle
# generations, testing) and you'd rather pay RTXPRO4000 rates than 5090 rates.
#
# Keep everything below in sync with comfyui.dstack.yml except the `resources`
# block and this header comment.
image: ghcr.io/andyhite/comfyui-runpod:latest

backends: [runpod]
fleets: [comfyui]
spot_policy: on-demand
max_price: 1.50

retry:
  on_events: [no-capacity, error, interruption]
  duration: 1h

env:
  - HF_TOKEN=${{ secrets.HF_TOKEN }}
  - PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu130
  - R2_BUCKET=comfyui
  - R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
  - RCLONE_CONFIG_R2_TYPE=s3
  - RCLONE_CONFIG_R2_PROVIDER=Cloudflare
  - RCLONE_CONFIG_R2_ACL=private
  - RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
  - RCLONE_CONFIG_R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
  - RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}

ports:
  - 8188
  - 8888
  - 8080

resources:
  # Blackwell only (same CUDA-13/R580+ driver requirement as comfyui.dstack.yml),
  # but no per-card name pin — the whole under-cap Blackwell menu is eligible
  # and dstack always takes the CHEAPEST match:
  #   RTXPRO4000   24GB  $0.57   <- normally wins this mode
  #   RTXPRO4500   32GB  $0.72
  #   RTX5090      32GB  $0.99
  #   RTXPRO5000   48GB  unlisted (no offers seen yet; price unconfirmed)
  #   RTXPRO6000 / B200       -  above $1.50, so never offered here
  # Must stay a superset of comfyui-fleet.dstack.yml's gpu spec.
  gpu:
    name: [RTXPRO4000, RTXPRO4500, RTX5090, RTXPRO5000]
    memory: 24GB..
  disk: 200GB..

max_duration: 12h

# No `commands`: see comfyui.dstack.yml — identical boot-time R2 restore/mirror
# entrypoint behavior.
