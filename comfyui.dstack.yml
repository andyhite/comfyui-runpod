type: task
name: comfyui

# Custom image = RunPod's ComfyUI base + our entrypoint (see Dockerfile).
# Keep this in sync with IMAGE/TAG in the Makefile. If the image is private on
# GHCR, either make the package public or add `registry_auth:` here.
image: ghcr.io/andyhite/comfyui-runpod:latest

# Region-agnostic: no network volume, so dstack picks the cheapest 24-48GB
# GPU anywhere on RunPod, on-demand, under $1.20/hr.
backends: [runpod]
spot_policy: on-demand
max_price: 1.20

# Retry on a different host if provisioning fails OR the entrypoint's CUDA
# preflight exits non-zero (old-driver host). dstack can't filter by driver, so
# this is what makes landing on a CUDA-13-capable host reliable.
retry:
  on_events: [no-capacity, error, interruption]
  duration: 1h

# Nothing is uploaded to the pod anymore: models, custom nodes, the user dir,
# and outputs all live in R2 and are restored at boot by the image entrypoint.
# (Set the R2 secrets below to enable that.)

# Secrets (set once with `dstack secret set <NAME> <value>`) — keeps account-
# specific values out of this public repo. The entrypoint builds the R2 endpoint
# from R2_ACCOUNT_ID.
#   HF_TOKEN   kept for nodes that call HF at runtime; no longer used for model
#              seeding (R2 is the sole model source)
#   R2_ACCOUNT_ID         your Cloudflare account id (for the R2 endpoint)
#   R2_ACCESS_KEY_ID      from a Cloudflare R2 API token (Object Read & Write)
#   R2_SECRET_ACCESS_KEY  ditto
# R2 turns on the model cache + output persistence; omit the R2_* secrets and
# the pod still runs (models from origin, outputs not persisted).
env:
  - HF_TOKEN=${{ secrets.HF_TOKEN }}
  # Let pip find the image's CUDA-pinned torch wheel when ComfyUI-Manager (or the
  # boot-time R2 restore's dependency install) installs a node that requires
  # torch — otherwise pip only sees PyPI, can't satisfy the constraint, and fails
  # with "ResolutionImpossible". Must match the image's CUDA build (cuda13.0 -> cu130).
  - PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu130
  - R2_BUCKET=comfyui
  - R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
  - RCLONE_CONFIG_R2_TYPE=s3
  - RCLONE_CONFIG_R2_PROVIDER=Cloudflare
  - RCLONE_CONFIG_R2_ACL=private
  - RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
  - RCLONE_CONFIG_R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
  - RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}

# Web UIs forwarded to localhost:
#   ComfyUI     -> http://localhost:8188
#   JupyterLab  -> http://localhost:8888  (tokenless: JUPYTER_PASSWORD unset)
#   FileBrowser -> http://localhost:8080  (default login admin / adminadmin12)
ports:
  - 8188
  - 8888
  - 8080

resources:
  # Whitelist only the architectures RunPod ships with the R580+ (CUDA 13)
  # driver: Ada Lovelace, Hopper, Blackwell. NOT Ampere (A40/A100/A5000/RTX3090)
  # — those stay on older drivers and would fail the CUDA preflight. dstack can't
  # filter by driver, so the preflight + retry below catch any stragglers.
  # max_price keeps the affordable ones (L4, RTXPRO4000/4500, RTX5090); the
  # H100/H200/B200/RTXPRO6000 entries are only used if you raise max_price.
  gpu:
    name: [L40, L40S, RTX4090, RTX5090, RTXPRO4000, RTXPRO4500, RTXPRO6000, H100, H100NVL, H200, B200]
    memory: 24GB..
  # ~100GB of fp16 models (WAN 14B hi/lo + Klein 9B + encoders) live on
  # ephemeral disk with no volume, so leave headroom for ComfyUI + outputs.
  disk: 200GB..

# Auto-stop the pod if the GPU sits below 10% for a full hour — i.e. you
# finished generating and walked away. The base image won't stop itself
# (ComfyUI is a server, and it stays alive even after a crash), so this is the
# safety net against a forgotten pod billing all weekend. Enforced by the
# in-container runner, so it works on RunPod (unlike fleet idle_duration).
# 1h is dstack's max time_window (3600s) — it won't accept anything larger.
utilization_policy:
  min_gpu_utilization: 10
  time_window: 1h

# No `commands`: the custom image's entrypoint restores custom_nodes + user from
# R2 (blocking), installs node deps, streams models + output from R2 in the
# background, starts a watcher per dir that mirrors it back to R2, then execs the
# base image's /start.sh.
#
# Persistence is via R2 (see env above): R2 is an exact mirror of
# custom_nodes/, user/, models/, and output/.
