type: task
name: comfyui

# Custom image = RunPod's ComfyUI base + our entrypoint (see Dockerfile).
# Keep this in sync with IMAGE/TAG in the Makefile. If the image is private on
# GHCR, either make the package public or add `registry_auth:` here.
image: ghcr.io/andyhite/comfyui-runpod:latest

# Region-agnostic: no network volume, so dstack picks the cheapest matching
# GPU anywhere on RunPod, on-demand, under $1.50/hr (RTX 5090 is $0.99 today).
backends: [runpod]
# Only provision into this repo's fleet; otherwise dstack may use any fleet in
# the project that fits (e.g. the looser `ollama` fleet).
fleets: [comfyui]
spot_policy: on-demand
max_price: 1.50

# Retry on a different host if provisioning fails OR the entrypoint's CUDA
# preflight exits non-zero (old-driver host). dstack can't filter by driver, so
# this is what makes landing on a CUDA-13-capable host reliable.
retry:
  on_events: [no-capacity, error, interruption]
  duration: 1h

# Nothing is uploaded to the pod anymore: models, custom nodes, the user dir,
# inputs, and outputs all live in R2 and are restored at boot by the entrypoint.
# (Set the R2 secrets below to enable that.)

# Secrets (set once with `dstack secret set <NAME> <value>`) — keeps account-
# specific values out of this public repo. The entrypoint builds the R2 endpoint
# from R2_ACCOUNT_ID.
#   HF_TOKEN   kept for nodes that call HF at runtime; no longer used for model
#              seeding (R2 is the sole model source)
#   R2_ACCOUNT_ID         your Cloudflare account id (for the R2 endpoint)
#   R2_ACCESS_KEY_ID      from a Cloudflare R2 API token (Object Read & Write)
#   R2_SECRET_ACCESS_KEY  ditto
# The R2 secrets enable persistence for ALL five mirrored dirs (custom_nodes,
# user, models, input, output). Omit them and the pod still runs, but with NO
# persistence — nothing is restored at boot and nothing is mirrored back.
env:
  - HF_TOKEN=${{ secrets.HF_TOKEN }}
  # Let pip find the image's CUDA-pinned torch wheel when ComfyUI-Manager (or the
  # boot-time R2 restore's dependency install) installs a node that requires
  # torch — otherwise pip only sees PyPI, can't satisfy the constraint, and fails
  # with "ResolutionImpossible". Must match the image's CUDA build (cuda13.0 -> cu130).
  - PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu130
  - R2_BUCKET=comfyui
  - R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
  - RCLONE_CONFIG_R2_TYPE=s3
  - RCLONE_CONFIG_R2_PROVIDER=Cloudflare
  - RCLONE_CONFIG_R2_ACL=private
  - RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
  - RCLONE_CONFIG_R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
  - RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}

# Web UIs forwarded to localhost:
#   ComfyUI     -> http://localhost:8188
#   JupyterLab  -> http://localhost:8888  (tokenless: JUPYTER_PASSWORD unset)
#   FileBrowser -> http://localhost:8080  (default login admin / adminadmin12)
ports:
  - 8188
  - 8888
  - 8080

resources:
  # Blackwell only — the CUDA-13 image needs an R580+ host driver, and on RunPod
  # that in practice means a Blackwell host. Of the Blackwell cards offered
  # under the cap, this is the whole menu (live `dstack offer`, 200GB disk):
  #   RTXPRO4000   24GB  $0.57   <- what we kept landing on: slowest of the four
  #   RTXPRO4500   32GB  $0.72   ~1.3x the 4000
  #   RTX5090      32GB  $0.99   ~3x the 4000, 1792GB/s, nvfp4 for Krea 2 quants
  #   RTXPRO5000   48GB  unlisted  fallback when no 5090 is available; no
  #                      offers seen yet, price unconfirmed (expected ~$1-1.5)
  #   RTXPRO6000 / B200       -  above $1.50, so never offered here
  # dstack always takes the CHEAPEST match, so the name list is the only knob
  # that picks a card: adding RTXPRO4500 back means always getting a 4500, not
  # a 5090. Keep this list and the fleet's (comfyui-fleet.dstack.yml) identical.
  gpu:
    name: [RTX5090, RTXPRO5000]
    memory: 32GB..
  # ~100GB of fp16 models (WAN 14B hi/lo + Klein 9B + encoders) live on
  # ephemeral disk with no volume, so leave headroom for ComfyUI + outputs.
  disk: 200GB..

# Hard cap: auto-stop the pod after 24h so a forgotten run can't bill all week.
# The GPU-idle policy below is the other auto-stop: terminates the run if the GPU
# sits below 10% for 30 minutes.
max_duration: 24h

utilization_policy:
  min_gpu_utilization: 10
  time_window: 30m

# No `commands`: the custom image's entrypoint restores custom_nodes + user from
# R2 (blocking), installs node deps, streams input + models + output from R2 in
# the background, starts a watcher per dir that mirrors it back to R2, then
# execs the base image's /start.sh.
#
# Persistence is via R2 (see env above): R2 is an exact mirror of
# custom_nodes/, user/, models/, input/, and output/.
